# yaml-language-server: $schema=../../../schemas/technical.schema.json
#
# General technical knowledge: how backend services are built.
# Ships with the harness and applies to every project; stack packs and
# projects can override entries (a project uses .harness/technical.yaml).
#
# For each kind:
#   description / examples / not  -> business words SemIf matches against
#   effects                        -> what must happen; for people, agents and the verifier
#   method / persistence / status  -> facts the Prolog engine reasons with
#   names_as                       -> naming rule for new services

kinds:
  create:
    description: "Make something new"
    examples: ["add", "create", "register", "submit", "rate"]
    not: "Not for changing something that already exists (use update), or for putting an existing thing into a group (use link)"
    effects:
      - "A new instance of the entity is created"
      - "A new row is inserted into the entity's database table"
      - "The identifier is generated by the system and returned"
      - "Required attributes are validated before saving"
      - "The response contains the created instance and its location"
    method: POST
    persistence: insert_row
    status: 201
    names_as: "add_{entity}"

  read_one:
    description: "Look at one specific thing"
    examples: ["view", "show", "open", "get details of"]
    effects:
      - "One instance is found by its identifier"
      - "One row is selected; nothing is changed"
      - "If no instance has that identifier, 'not found' (404) is returned"
    method: GET
    persistence: select_one
    status: 200
    names_as: "get_{entity}"

  query:
    description: "Find or list several things"
    examples: ["list", "search", "show all", "browse", "filter"]
    effects:
      - "Many instances are selected; nothing is changed"
      - "Filters become query parameters and are echoed in the response"
      - "Results are paged; the response includes paging information"
    method: GET
    persistence: select_many
    status: 200
    names_as: "list_{entities}"
    accepts: [filters]

  update:
    description: "Change some details of something that exists"
    examples: ["edit", "change", "correct", "set the price"]
    not: "Not for replacing all details (use replace), and not for moving through a lifecycle (use transition)"
    effects:
      - "Only the named attributes of one instance change"
      - "The existing row is updated; other columns are untouched"
      - "Changed values are validated with the same rules as on create"
    method: PATCH
    persistence: update_row
    status: 200
    names_as: "change_{entity}_{attribute}"
    accepts: [changes]

  replace:
    description: "Replace all the details of something that exists"
    examples: ["replace", "overwrite", "re-enter all details of", "save the full record of"]
    not: "Not for changing just a few details (use update), and not for moving through a lifecycle (use transition)"
    effects:
      - "All editable attributes of one instance are replaced with the values sent"
      - "The existing row is updated in full; editable attributes left out are reset to their defaults or emptied"
      - "Every required attribute must be sent, as on create"
      - "The identifier comes from the path and cannot be changed"
      - "Generated attributes and the lifecycle field are never changed (lifecycle changes use transition)"
      - "Sending the same request twice gives the same result"
      - "If no instance has that identifier, 'not found' (404) is returned"
    method: PUT
    persistence: replace_row
    status: 200
    names_as: "replace_{entity}"

  transition:
    description: "Move something to another stage of its life"
    examples: ["archive", "approve", "cancel", "publish", "restore"]
    not: "Not for editing ordinary details (use update)"
    effects:
      - "The lifecycle field of one instance changes from one state to another"
      - "The row's status column is updated"
      - "The move is checked against the allowed transitions; if not allowed, a conflict (409) is returned"
    method: PATCH
    persistence: update_row
    status: 200
    names_as: "{verb}_{entity}"
    accepts: [moves]

  delete:
    description: "Remove something"
    examples: ["delete", "remove", "discard"]
    not: "Not for taking a thing out of a group (use unlink)"
    effects:
      - "The instance stops existing for users"
      - "The row is deleted (or marked deleted, per project policy)"
      - "Composition children are removed with it"
    method: DELETE
    persistence: delete_row
    status: 204
    names_as: "remove_{entity}"

  link:
    description: "Connect two existing things, like putting a book into a list"
    examples: ["add to", "include in", "attach to", "set the"]
    not: "Not for creating the thing itself (use create)"
    effects:
      - "Two existing instances become associated"
      - "Neither instance is created or changed; only the connection is stored"
      - "Both instances must already exist"
    method: PUT
    persistence: insert_link
    status: 204
    names_as: "add_{target}_to_{entity}"
    target: association

  unlink:
    description: "Disconnect two things, like taking a book out of a list"
    examples: ["remove from", "take out of", "detach from"]
    not: "Not for deleting the thing itself (use delete)"
    effects:
      - "The connection between two instances ends"
      - "Both instances keep existing"
    method: DELETE
    persistence: delete_link
    status: 204
    names_as: "remove_{target}_from_{entity}"
    target: association

# ── Components a design can include ─────────────────────────────────
components:
  serialization:       { description: "Turn stored data into the response shape" }
  body_validation:     { description: "Check the request body against the entity's attribute rules" }
  partial_validation:  { description: "Check only the attributes being changed" }
  full_validation:     { description: "Check every editable attribute, as on create" }
  not_found_handling:  { description: "Return 404 when no instance has the identifier" }
  pagination:          { description: "Split long lists into pages" }
  transition_guard:    { description: "Allow only the lifecycle moves the entity defines" }
  parent_exists_check: { description: "Check the parent exists before acting on its child" }
  cascade_children:    { description: "Remove composition children together with their parent" }
  both_exist_check:    { description: "Check both sides of a connection exist" }
  auth_check:          { description: "Require a logged-in user" }
  admin_role_check:    { description: "Allow only administrators" }
  read_cache:          { description: "Serve repeated reads from a cache" }

# ── Bridge rules: domain facts -> technical decisions ───────────────
# Every rule has an id; it appears in the proof of each decision.
rules:
  - id: always-serialize
    then: { components: [serialization] }

  - id: create-validates-body
    when: { kind: create }
    then: { components: [body_validation] }

  - id: update-validates-changes
    when: { kind: update }
    then: { components: [partial_validation] }

  - id: replace-validates-all
    when: { kind: replace }
    then: { components: [full_validation] }

  - id: identifier-in-path
    when: { kind_in: [read_one, update, replace, transition, delete] }
    then: { route_param: identifier, components: [not_found_handling] }

  - id: filters-are-params
    when: { has: filters }
    then: { query_params: from_filters, response_includes: [applied_filters] }

  - id: lists-are-paged
    when: { kind: query }
    then: { components: [pagination], response_includes: [paging] }

  - id: transition-guard
    when: { kind: transition }
    then: { components: [transition_guard], error_status: 409 }

  - id: composition-nested
    when: { has: within }
    then: { route: nested, components: [parent_exists_check] }

  - id: composition-cascade
    when: { kind: delete, parent_of_composition: true }
    then: { components: [cascade_children] }

  - id: aggregation-link-table
    when: { kind_in: [link, unlink], cardinality: many_to_many }
    then: { persistence_target: link_table, components: [both_exist_check] }

  - id: aggregation-reference
    when: { kind_in: [link, unlink], cardinality: one_to_many }
    then: { persistence_target: reference, components: [both_exist_check] }

  - id: login-needs-auth
    when: { fact: requires_login }
    then: { components: [auth_check] }

  - id: admin-only
    when: { fact: admin_only }
    then: { components: [auth_check, admin_role_check] }

  - id: cached-reads
    when: { fact: cached }
    then: { components: [read_cache] }

# ── Askable facts: yes/no questions SemIf may be asked ──────────────
askable:
  requires_login: "Does this task require the user to be logged in?"
  admin_only: "Is this action limited to administrators?"
  cached: "Should the results of this service be cached?"
