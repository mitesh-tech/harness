name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Validate the Bookstore knowledge
        run: uv run harness validate --project examples/bookstore

  bookstore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/bookstore
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: examples/bookstore/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run pytest
