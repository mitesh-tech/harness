service:
  name: <verb>_book
  new: true
kind: transition
target: Book
details:
  moves: archived -> active
api:
  method: PATCH
  path: /books/{book_id}/<verb>
  path_params:
    book_id:
      type: id
      refers_to: Book
  response:
    status: 200
    shape: item
    fields:
      id:
        type: id
        generated: true
      isbn:
        type: text
        unique: true
      title:
        type: text
        required: true
      author:
        type: text
        required: true
      price:
        type: money
        required: true
        min: 0
      status:
        type: text
        one_of:
        - active
        - archived
        initial: active
  errors:
  - status: 404
    when: no Book has this book_id
    rule: not-found
  - status: 409
    when: Book can't move from its current stage to that one
    rule: transition-guard
data:
  source: bookstore_db
  type: relational
  table: books
  columns:
    id: id
    isbn: isbn
    title: title
    author: author
    price: price
    status: status
  operation: update_row
components:
- name: serialization
  rule: always-serialize
- name: not_found_handling
  rule: identifier-in-path
- name: transition_guard
  rule: transition-guard
tests:
- name: moves a Book to another stage
  given:
  - create: Book
    as: book
    with:
      title: Title 1
      author: Author 1
      price: 9.99
  request:
    method: PATCH
    path: /books/{book.id}/<verb>
  expect:
    status: 200
  rule: kind transition
- name: no Book has this book_id
  request:
    method: PATCH
    path: /books/999999/<verb>
  expect:
    status: 404
    problem: no Book has this book_id
  rule: not-found
sources:
  api.method: kind transition
  api.path: rule transition-verb-in-path
  api.path_params.book_id: rule identifier-in-path
  api.response.status: kind transition
  api.response.shape: rule item-response
  api.response.fields: rule item-response
  data: data.yaml
  tests: 'derived from the design and domain.yaml: a success case, one per error, invalid values; example
    values by rule'
  service.name: open question
  details: SemIf yes/no questions about the task
open_questions:
- What should the new service be called? Kind transition names services {verb}_{entity}; the verb is not
  known yet
