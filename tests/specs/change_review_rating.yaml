task: Readers should be able to change their rating of a book through a new endpoint
factory: crud-api
status: draft
service:
  name: change_review_rating
  new: true
kind: change
target: Review
parent: Book
details:
  changes:
  - rating
api:
  method: PATCH
  path: /books/{book_id}/reviews/{review_id}
  path_params:
    book_id:
      type: id
      refers_to: Book
    review_id:
      type: id
      refers_to: Review
  request:
    fields:
      rating:
        type: integer
        required: false
        min: 1
        max: 5
  response:
    status: 200
    shape: item
    fields:
      id:
        type: id
        generated: true
      rating:
        type: integer
        required: true
        min: 1
        max: 5
      comment:
        type: text
  errors:
  - status: 404
    when: no Book has this book_id
    rule: not-found
  - status: 404
    when: no Review has this review_id
    rule: not-found
  - status: 422
    when: invalid or missing fields
    rule: invalid-body
data:
  source: bookstore_db
  type: relational
  table: reviews
  columns:
    id: id
    rating: rating
    comment: comment
  operation: update_row
  parent_key: book_id
  parent_table: books
  parent_column: id
components:
- name: serialization
  rule: always-serialize
- name: partial_validation
  rule: update-validates-changes
- name: not_found_handling
  rule: identifier-in-path
- name: parent_exists_check
  rule: composition-nested
tests:
- name: changes a Review
  given:
  - create: Book
    as: book
    with:
      title: Title 1
      author: Author 1
      price: 9.99
  - create: Review
    as: review
    with:
      rating: 1
    within: book
  request:
    method: PATCH
    path: /books/{book.id}/reviews/{review.id}
    body:
      rating: 1
  expect:
    status: 200
    body:
      rating: 1
  rule: kind change
- name: no Book has this book_id
  request:
    method: PATCH
    path: /books/999999/reviews/{review.id}
    body:
      rating: 1
  expect:
    status: 404
    problem: no Book has this book_id
  rule: not-found
- name: no Review has this review_id
  given:
  - create: Book
    as: book
    with:
      title: Title 1
      author: Author 1
      price: 9.99
  request:
    method: PATCH
    path: /books/{book.id}/reviews/999999
    body:
      rating: 1
  expect:
    status: 404
    problem: no Review has this review_id
  rule: not-found
open_questions:
- Does the task change the comment of a Review? (SemIf 0.32)
sources:
  api.method: kind change
  api.path: rule item-path
  api.path_params.book_id: rule identifier-in-path
  api.path_params.review_id: rule identifier-in-path
  api.request.fields.rating: rule change-body; details from domain.yaml Review.rating
  api.response.status: kind change
  api.response.shape: rule item-response
  api.response.fields: rule item-response
  data: data.yaml
  tests: 'derived from the design and domain.yaml: a success case, one per error, invalid values; example
    values by rule'
  service.name: 'rule: kind change names services change_{entity}_{attribute}'
  details: SemIf yes/no questions about the task
