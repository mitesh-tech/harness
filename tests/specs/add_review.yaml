task: Readers should be able to rate a book from 1 to 5 through a new endpoint
factory: crud-api
status: draft
service:
  name: add_review
  new: false
kind: create
target: Review
parent: Book
api:
  method: POST
  path: /books/{book_id}/reviews
  path_params:
    book_id:
      type: id
      refers_to: Book
  request:
    fields:
      rating:
        type: integer
        required: true
        min: 1
        max: 5
      comment:
        type: text
  response:
    status: 201
    shape: item
    fields:
      id:
        type: id
        generated: true
      rating:
        type: integer
        required: true
        min: 1
        max: 5
      comment:
        type: text
    headers:
    - Location
  errors:
  - status: 404
    when: no Book has this book_id
    rule: not-found
  - status: 422
    when: invalid or missing fields
    rule: invalid-body
data:
  source: bookstore_db
  type: relational
  table: reviews
  columns:
    id: id
    rating: rating
    comment: comment
  operation: insert_row
  parent_key: book_id
  parent_table: books
  parent_column: id
components:
- name: serialization
  rule: always-serialize
- name: body_validation
  rule: create-validates-body
- name: parent_exists_check
  rule: composition-nested
tests:
- name: creates a Review
  given:
  - create: Book
    as: book
    with:
      title: Title 1
      author: Author 1
      price: 9.99
  request:
    method: POST
    path: /books/{book.id}/reviews
    body:
      rating: 1
      comment: Comment 1
  expect:
    status: 201
    headers:
    - Location
    body:
      rating: 1
      comment: Comment 1
  rule: kind create
- name: no Book has this book_id
  request:
    method: POST
    path: /books/999999/reviews
    body:
      rating: 1
      comment: Comment 1
  expect:
    status: 404
    problem: no Book has this book_id
  rule: not-found
- name: rating is required
  given:
  - create: Book
    as: book
    with:
      title: Title 1
      author: Author 1
      price: 9.99
  request:
    method: POST
    path: /books/{book.id}/reviews
    body:
      comment: Comment 1
  expect:
    status: 422
    problem: invalid or missing fields
  rule: invalid-body
- name: rating above 5 is invalid
  given:
  - create: Book
    as: book
    with:
      title: Title 1
      author: Author 1
      price: 9.99
  request:
    method: POST
    path: /books/{book.id}/reviews
    body:
      rating: 6
      comment: Comment 1
  expect:
    status: 422
    problem: invalid or missing fields
  rule: invalid-body
open_questions: []
sources:
  api.method: kind create
  api.path: rule collection-path
  api.path_params.book_id: rule identifier-in-path
  api.request.fields.rating: rule create-body; details from domain.yaml Review.rating
  api.request.fields.comment: rule create-body; details from domain.yaml Review.comment
  api.response.status: kind create
  api.response.shape: rule item-response
  api.response.fields: rule item-response
  data: data.yaml
  tests: 'derived from the design and domain.yaml: a success case, one per error, invalid values; example
    values by rule'
