task: Let staff add a new publisher through a new endpoint
factory: crud-api
status: draft
service:
  name: add_publisher
  new: true
kind: create
target: Publisher
api:
  method: POST
  path: /publishers
  request:
    fields:
      name:
        type: text
        required: true
        unique: true
  response:
    status: 201
    shape: item
    fields:
      id:
        type: id
        generated: true
      name:
        type: text
        required: true
        unique: true
    headers:
    - Location
  errors:
  - status: 422
    when: invalid or missing fields
    rule: invalid-body
  - status: 409
    when: another Publisher already has this name
    rule: unique-taken
data:
  source: bookstore_db
  type: relational
  table: publishers
  columns:
    id: id
    name: name
  operation: insert_row
components:
- name: serialization
  rule: always-serialize
- name: body_validation
  rule: create-validates-body
tests:
- name: creates a Publisher
  request:
    method: POST
    path: /publishers
    body:
      name: Name 1
  expect:
    status: 201
    headers:
    - Location
    body:
      name: Name 1
  rule: kind create
- name: another Publisher already has this name
  given:
  - create: Publisher
    as: existing_publisher
    with:
      name: Name 1
  request:
    method: POST
    path: /publishers
    body:
      name: Name 1
  expect:
    status: 409
    problem: another Publisher already has this name
  rule: unique-taken
- name: name is required
  request:
    method: POST
    path: /publishers
    body: {}
  expect:
    status: 422
    problem: invalid or missing fields
  rule: invalid-body
open_questions: []
sources:
  api.method: kind create
  api.path: rule collection-path
  api.request.fields.name: rule create-body; details from domain.yaml Publisher.name
  api.response.status: kind create
  api.response.shape: rule item-response
  api.response.fields: rule item-response
  data: data.yaml
  tests: 'derived from the design and domain.yaml: a success case, one per error, invalid values; example
    values by rule'
  service.name: 'rule: kind create names services add_{entity}'
