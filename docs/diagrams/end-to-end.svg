<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1546" viewBox="0 0 680 1546" role="img">
<title>Harness end to end with resolver</title>
<desc>Decide: SemIf reads the domain knowledge base and returns a capability with its facts. The resolver then applies fixed rules: the architecture lookup table gives method and pattern, component rules give components, and SemIf is asked only about open gaps. Unsure or conflicting results go to a human and open a KB pull request. Build: approve the API contract, find context, a generator builds known patterns after the spec is confirmed, otherwise an LLM builds the units; models.yaml and agent roles pick the model. Verify: pack commands run tests and checks, then SemIf yes/no per criterion; failures move the model up or go to a human. Learn: audit report, human-confirmed eval cases, eval run in CI, and a human reviews and merges changes back into the rules and knowledge base.</desc>
