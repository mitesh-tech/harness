<line class="arr" x1="330" y1="736" x2="330" y2="760" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="200" y="760" width="260" height="56" rx="4"/><text class="th" x="330" y="783" text-anchor="middle">Confirm spec</text><text class="ts" x="330" y="802" text-anchor="middle">you approve or edit it</text></g>
