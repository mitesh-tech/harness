<g class="c-gray"><rect x="200" y="680" width="260" height="56" rx="4"/><text class="th" x="330" y="703" text-anchor="middle">Generate spec</text><text class="ts" x="330" y="722" text-anchor="middle">contract, mapping, tests, questions</text></g>
