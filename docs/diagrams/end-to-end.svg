<line class="arr" x1="460" y1="132" x2="490" y2="132" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="490" y="104" width="150" height="56" rx="4"/><text class="th" x="565" y="127" text-anchor="middle">UNSUPPORTED</text><text class="ts" x="565" y="146" text-anchor="middle">no factory fits</text></g>
<line class="arr" x1="330" y1="160" x2="330" y2="200" marker-end="url(#arrow)"/>

<rect class="frame" x="30" y="176" width="620" height="734" rx="8"/>
<text class="lbl" x="40" y="193">CRUD API factory</text>
<g class="c-coral"><rect x="40" y="200" width="130" height="56" rx="4"/><text class="th" x="105" y="223" text-anchor="middle">Domain KB</text><text class="ts" x="105" y="242" text-anchor="middle">entities, links</text></g>
<line class="arr" x1="170" y1="228" x2="200" y2="228" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="200" y="200" width="260" height="56" rx="4"/><text class="th" x="330" y="223" text-anchor="middle">Which entity?</text><text class="ts" x="330" y="242" text-anchor="middle">SemIf, options from the KB</text></g>
