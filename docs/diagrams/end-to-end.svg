<line class="arr" x1="330" y1="256" x2="330" y2="280" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="200" y="280" width="260" height="56" rx="4"/><text class="th" x="330" y="303" text-anchor="middle">New API or change?</text><text class="ts" x="330" y="322" text-anchor="middle">SemIf</text></g>
<line class="arr" x1="460" y1="308" x2="490" y2="308" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="490" y="280" width="150" height="56" rx="4"/><text class="th" x="565" y="303" text-anchor="middle">B: change API</text><text class="ts" x="565" y="322" text-anchor="middle">add/remove attribute</text></g>
<line class="arr" x1="565" y1="336" x2="565" y2="360" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="490" y="360" width="150" height="56" rx="4"/><text class="th" x="565" y="383" text-anchor="middle">Impact analysis</text><text class="ts" x="565" y="402" text-anchor="middle">Prolog: affected APIs</text></g>
<path class="arr" d="M640 388 H658 V628 H460" marker-end="url(#arrow)"/>
<line class="arr" x1="330" y1="336" x2="330" y2="360" marker-end="url(#arrow)"/>
<text class="sub" x="336" y="352">new</text>
<g class="c-coral"><rect x="40" y="360" width="130" height="56" rx="4"/><text class="th" x="105" y="383" text-anchor="middle">CRUD knowledge</text><text class="ts" x="105" y="402" text-anchor="middle">operations, rules</text></g>
<line class="arr" x1="170" y1="388" x2="200" y2="388" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="200" y="360" width="260" height="56" rx="4"/><text class="th" x="330" y="383" text-anchor="middle">A: which operation?</text><text class="ts" x="330" y="402" text-anchor="middle">create, read, update, delete</text></g>
<line class="arr" x1="330" y1="416" x2="330" y2="440" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="200" y="440" width="260" height="56" rx="4"/><text class="th" x="330" y="463" text-anchor="middle">Find service</text><text class="ts" x="330" y="482" text-anchor="middle">lookup; SemIf confirms or new</text></g>
