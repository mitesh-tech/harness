<rect x="0" y="0" width="680" height="1240" fill="#FFFFFF"/>

<g class="c-gray"><rect x="230" y="40" width="200" height="44" rx="4"/><text class="th" x="330" y="67" text-anchor="middle">Task (business words)</text></g>
