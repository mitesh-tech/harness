<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1240" viewBox="0 0 680 1240" role="img">
<title>End-to-end flow with the CRUD API factory</title>
<desc>A task goes to the factory router (SemIf); if no factory fits it ends as unsupported. In the CRUD API factory, SemIf picks the entity from the domain KB; if none, the user adds it. SemIf decides new API or change. For a new API: SemIf picks the CRUD operation, a lookup finds existing services which SemIf confirms, and the data mapping must exist or it ends as no mapping. For a change: SemIf identifies add or remove attribute and Prolog analyses affected APIs. Both lead to Prolog resolving the design. A spec is generated and saved in the run folder. You confirm the spec by approving or editing it; edits are re-checked. Code is generated from the confirmed spec using the factory templates for the stack pack, then verified against the spec, reported, and learned from, with learning feeding back into the knowledge base.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .lbl { font-size: 14px; font-weight: 500; fill: #444441; }
  .sub { font-size: 12px; fill: #5F5E5A; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .frame { fill: none; stroke: #B4B2A9; stroke-width: 0.75; stroke-dasharray: 4 3; }
  .c-gray > rect, rect.c-gray     { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray > .th   { fill: #444441; }  .c-gray > .ts   { fill: #5F5E5A; }
  .c-teal > rect, rect.c-teal     { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal > .th   { fill: #085041; }  .c-teal > .ts   { fill: #0F6E56; }
  .c-coral > rect, rect.c-coral   { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral > .th  { fill: #712B13; }  .c-coral > .ts  { fill: #993C1D; }
  .c-pink > rect, rect.c-pink     { fill: #FBEAF0; stroke: #993556; stroke-width: 0.5; }
  .c-pink > .th   { fill: #72243E; }  .c-pink > .ts   { fill: #993556; }
</style>
