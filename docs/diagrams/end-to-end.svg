<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1440" viewBox="0 0 680 1440" role="img">
<title>Harness end to end with all components</title>
<desc>Four sections. Decide: a task in domain words passes through domain, architecture and implementation layers, each fed by its knowledge base; none or unsure goes to a human via an LLM draft and KB pull request. Build: approve the API contract, find context using pack paths, if a generator exists gather inputs, confirm the spec, run the generator, and an LLM fills extension stubs; otherwise an LLM builds all units. Verify: tests and checks using pack commands, then SemIf yes/no per criterion; failures move the model up or go to a human. Learn: audit report, save human-confirmed eval cases, eval run in CI with per-layer gates, and a human reviews and merges changes back into the knowledge base.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .lbl { font-size: 14px; font-weight: 500; fill: #444441; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .bus { stroke: #888780; stroke-width: 1.5; fill: none; }
  .frame { fill: none; stroke: #B4B2A9; stroke-width: 0.75; stroke-dasharray: 4 3; }
  .c-gray > rect, rect.c-gray     { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray > .th   { fill: #444441; }  .c-gray > .ts   { fill: #5F5E5A; }
  .c-teal > rect, rect.c-teal     { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal > .th   { fill: #085041; }  .c-teal > .ts   { fill: #0F6E56; }
  .c-coral > rect, rect.c-coral   { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral > .th  { fill: #712B13; }  .c-coral > .ts  { fill: #993C1D; }
  .c-purple > rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple > .th { fill: #3C3489; }  .c-purple > .ts { fill: #534AB7; }
  .c-pink > rect, rect.c-pink     { fill: #FBEAF0; stroke: #993556; stroke-width: 0.5; }
  .c-pink > .th   { fill: #72243E; }  .c-pink > .ts   { fill: #993556; }
  .legend { font-size: 12px; fill: #5F5E5A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="1440" fill="#FFFFFF"/>

<g class="c-gray"><rect x="230" y="40" width="200" height="44" rx="4"/><text class="th" x="330" y="67" text-anchor="middle">New task (domain words)</text></g>
<line class="arr" x1="330" y1="84" x2="330" y2="124" marker-end="url(#arrow)"/>

<rect class="frame" x="30" y="100" width="620" height="222" rx="8"/>
<text class="lbl" x="40" y="117">Decide</text>
<g class="c-coral"><rect x="40" y="124" width="140" height="52" rx="4"/><text class="th" x="110" y="145" text-anchor="middle">Domain KB</text><text class="ts" x="110" y="164" text-anchor="middle">entities, rules</text></g>
<g class="c-coral"><rect x="40" y="190" width="140" height="52" rx="4"/><text class="th" x="110" y="211" text-anchor="middle">Architecture KB</text><text class="ts" x="110" y="230" text-anchor="middle">endpoints, patterns</text></g>
<g class="c-coral"><rect x="40" y="256" width="140" height="52" rx="4"/><text class="th" x="110" y="277" text-anchor="middle">Implementation KB</text><text class="ts" x="110" y="296" text-anchor="middle">components</text></g>
<line class="arr" x1="180" y1="150" x2="210" y2="150" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line class="arr" x1="180" y1="216" x2="210" y2="216" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line class="arr" x1="180" y1="282" x2="210" y2="282" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="210" y="124" width="240" height="52" rx="4"/><text class="th" x="330" y="145" text-anchor="middle">Domain layer</text><text class="ts" x="330" y="164" text-anchor="middle">SemIf: which capability?</text></g>
<line class="arr" x1="330" y1="176" x2="330" y2="190" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="210" y="190" width="240" height="52" rx="4"/><text class="th" x="330" y="211" text-anchor="middle">Architecture layer</text><text class="ts" x="330" y="230" text-anchor="middle">links, SemIf for gaps</text></g>
<line class="arr" x1="330" y1="242" x2="330" y2="256" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="210" y="256" width="240" height="52" rx="4"/><text class="th" x="330" y="277" text-anchor="middle">Implementation layer</text><text class="ts" x="330" y="296" text-anchor="middle">components, complexity</text></g>
<line class="arr" x1="450" y1="150" x2="480" y2="150" marker-end="url(#arrow)"/>
<line class="arr" x1="450" y1="216" x2="480" y2="216" marker-end="url(#arrow)"/>
<line class="arr" x1="450" y1="282" x2="480" y2="282" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="480" y="124" width="160" height="184" rx="4"/><text class="th" x="560" y="192" text-anchor="middle">None or unsure</text><text class="ts" x="560" y="212" text-anchor="middle">LLM drafts option,</text><text class="ts" x="560" y="230" text-anchor="middle">you confirm,</text><text class="ts" x="560" y="248" text-anchor="middle">opens KB pull request</text></g>
<path class="arr" d="M640 216 H662 V1332 H450" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line class="arr" x1="330" y1="308" x2="330" y2="364" marker-end="url(#arrow)"/>

<rect class="frame" x="30" y="340" width="620" height="550" rx="8"/>
<text class="lbl" x="40" y="357">Build</text>
<g class="c-coral"><rect x="210" y="364" width="240" height="52" rx="4"/><text class="th" x="330" y="385" text-anchor="middle">API contract</text><text class="ts" x="330" y="404" text-anchor="middle">you approve the schema</text></g>
<line class="arr" x1="330" y1="416" x2="330" y2="430" marker-end="url(#arrow)"/>
<g class="c-pink"><rect x="40" y="430" width="140" height="52" rx="4"/><text class="th" x="110" y="451" text-anchor="middle">pack: paths</text><text class="ts" x="110" y="470" text-anchor="middle">where code lives</text></g>
<line class="arr" x1="180" y1="456" x2="210" y2="456" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="210" y="430" width="240" height="52" rx="4"/><text class="th" x="330" y="451" text-anchor="middle">Find context</text><text class="ts" x="330" y="470" text-anchor="middle">search + SemIf per file</text></g>
<line class="arr" x1="330" y1="482" x2="330" y2="496" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="210" y="496" width="240" height="44" rx="4"/><text class="th" x="330" y="523" text-anchor="middle">Generator for this path?</text></g>
<line class="arr" x1="450" y1="518" x2="480" y2="518" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="480" y="490" width="160" height="56" rx="4"/><text class="th" x="560" y="513" text-anchor="middle">No generator</text><text class="ts" x="560" y="532" text-anchor="middle">LLM builds all units</text></g>
<path class="arr" d="M560 546 V784 H450" marker-end="url(#arrow)"/>
<line class="arr" x1="330" y1="540" x2="330" y2="560" marker-end="url(#arrow)"/>
<g class="c-pink"><rect x="40" y="560" width="140" height="52" rx="4"/><text class="th" x="110" y="581" text-anchor="middle">Input schemas</text><text class="ts" x="110" y="600" text-anchor="middle">from the pack</text></g>
<line class="arr" x1="180" y1="586" x2="210" y2="586" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="210" y="560" width="240" height="52" rx="4"/><text class="th" x="330" y="581" text-anchor="middle">Gather inputs</text><text class="ts" x="330" y="600" text-anchor="middle">contract, DB, links, SemIf</text></g>
<line class="arr" x1="330" y1="612" x2="330" y2="626" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="210" y="626" width="240" height="52" rx="4"/><text class="th" x="330" y="647" text-anchor="middle">Confirm spec</text><text class="ts" x="330" y="666" text-anchor="middle">missing inputs: ask you</text></g>
<line class="arr" x1="330" y1="678" x2="330" y2="692" marker-end="url(#arrow)"/>
<g class="c-pink"><rect x="40" y="692" width="140" height="52" rx="4"/><text class="th" x="110" y="713" text-anchor="middle">Tools registry</text><text class="ts" x="110" y="732" text-anchor="middle">generators, MCP</text></g>
<line class="arr" x1="180" y1="718" x2="210" y2="718" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="210" y="692" width="240" height="52" rx="4"/><text class="th" x="330" y="713" text-anchor="middle">Run generator</text><text class="ts" x="330" y="732" text-anchor="middle">code + extension stubs</text></g>
<line class="arr" x1="330" y1="744" x2="330" y2="758" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="758" width="140" height="118" rx="4"/><text class="th" x="110" y="802" text-anchor="middle">models.yaml</text><text class="ts" x="110" y="822" text-anchor="middle">.agents roles</text><text class="ts" x="110" y="840" text-anchor="middle">agent CLIs</text></g>
<line class="arr" x1="180" y1="784" x2="210" y2="784" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line class="arr" x1="180" y1="850" x2="210" y2="850" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="210" y="758" width="240" height="52" rx="4"/><text class="th" x="330" y="779" text-anchor="middle">LLM writes code</text><text class="ts" x="330" y="798" text-anchor="middle">stubs or units, by level</text></g>
<line class="arr" x1="330" y1="810" x2="330" y2="824" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="210" y="824" width="240" height="52" rx="4"/><text class="th" x="330" y="845" text-anchor="middle">Cross-cutting steps</text><text class="ts" x="330" y="864" text-anchor="middle">logging, errors, docs</text></g>
<line class="arr" x1="330" y1="876" x2="330" y2="932" marker-end="url(#arrow)"/>

<rect class="frame" x="30" y="908" width="620" height="156" rx="8"/>
<text class="lbl" x="40" y="925">Verify</text>
<g class="c-pink"><rect x="40" y="932" width="140" height="52" rx="4"/><text class="th" x="110" y="953" text-anchor="middle">pack: commands</text><text class="ts" x="110" y="972" text-anchor="middle">test, lint, types</text></g>
<line class="arr" x1="180" y1="958" x2="210" y2="958" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="210" y="932" width="240" height="52" rx="4"/><text class="th" x="330" y="953" text-anchor="middle">Tests and checks</text><text class="ts" x="330" y="972" text-anchor="middle">tests, lint, scope, checksums</text></g>
<line class="arr" x1="330" y1="984" x2="330" y2="998" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="210" y="998" width="240" height="52" rx="4"/><text class="th" x="330" y="1019" text-anchor="middle">SemIf verify</text><text class="ts" x="330" y="1038" text-anchor="middle">yes/no per criterion</text></g>
<line class="arr" x1="450" y1="958" x2="480" y2="958" marker-end="url(#arrow)"/>
<line class="arr" x1="450" y1="1024" x2="480" y2="1024" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="480" y="932" width="160" height="118" rx="4"/><text class="th" x="560" y="986" text-anchor="middle">Fail: model up</text><text class="ts" x="560" y="1006" text-anchor="middle">unsure: you decide</text></g>
<path class="arr" d="M610 932 V800 H450" marker-end="url(#arrow)"/>
<line class="arr" x1="330" y1="1050" x2="330" y2="1108" marker-end="url(#arrow)"/>

<rect class="frame" x="30" y="1084" width="620" height="288" rx="8"/>
<text class="lbl" x="40" y="1101">Learn</text>
<g class="c-gray"><rect x="210" y="1108" width="240" height="52" rx="4"/><text class="th" x="330" y="1129" text-anchor="middle">Audit report</text><text class="ts" x="330" y="1148" text-anchor="middle">path, models, gaps</text></g>
<line class="arr" x1="330" y1="1160" x2="330" y2="1174" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="210" y="1174" width="240" height="52" rx="4"/><text class="th" x="330" y="1195" text-anchor="middle">Save eval case</text><text class="ts" x="330" y="1214" text-anchor="middle">human-confirmed only</text></g>
<line class="arr" x1="210" y1="1200" x2="180" y2="1200" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="1174" width="140" height="52" rx="4"/><text class="th" x="110" y="1195" text-anchor="middle">evals/cases/</text><text class="ts" x="110" y="1214" text-anchor="middle">one file per case</text></g>
<path class="arr" d="M110 1226 V1266 H210" marker-end="url(#arrow)"/>
<line class="arr" x1="330" y1="1226" x2="330" y2="1240" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="210" y="1240" width="240" height="52" rx="4"/><text class="th" x="330" y="1261" text-anchor="middle">Eval run (CI)</text><text class="ts" x="330" y="1280" text-anchor="middle">per-layer gates</text></g>
<line class="arr" x1="330" y1="1292" x2="330" y2="1306" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="210" y="1306" width="240" height="52" rx="4"/><text class="th" x="330" y="1327" text-anchor="middle">You review and merge</text><text class="ts" x="330" y="1346" text-anchor="middle">KB, generators, models</text></g>
<path class="arr" d="M210 1332 H20 V282 H40" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect class="c-coral" x="60" y="1400" width="12" height="12" rx="2"/><text class="legend" x="80" y="1410">You and KB</text>
<rect class="c-teal" x="175" y="1400" width="12" height="12" rx="2"/><text class="legend" x="195" y="1410">SemIf</text>
<rect class="c-purple" x="260" y="1400" width="12" height="12" rx="2"/><text class="legend" x="280" y="1410">LLM agents</text>
<rect class="c-pink" x="375" y="1400" width="12" height="12" rx="2"/><text class="legend" x="395" y="1410">Stack pack</text>
<rect class="c-gray" x="490" y="1400" width="12" height="12" rx="2"/><text class="legend" x="510" y="1410">Harness code</text>
</svg>
