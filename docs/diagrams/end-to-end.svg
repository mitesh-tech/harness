<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1608" viewBox="0 0 680 1608" role="img">
<title>Harness end to end with SemIf and Prolog</title>
<desc>Decide: SemIf picks which service a task is, using options from the domain KB, producing task facts with confidence. The Prolog engine derives the design from the facts using the technical KB and bridge rules. If a fact is missing, the harness asks SemIf an askable yes/no question and feeds the answer back. The result is the design with proof. Unsure tasks or missing rules go to a human via an LLM draft and KB pull request. Build: confirm the design and contract, find context, a generator builds known patterns after the spec is confirmed, otherwise an LLM builds units; models.yaml and agent roles pick the model. Verify: pack commands run tests and checks, then SemIf yes/no per criterion; failures move the model up or go to a human. Learn: audit report with proofs, human-confirmed eval cases, eval run in CI, and a human reviews and merges changes back into the knowledge base.</desc>
