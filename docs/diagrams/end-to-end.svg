<g class="c-gray"><rect x="200" y="520" width="260" height="56" rx="4"/><text class="th" x="330" y="543" text-anchor="middle">Data mapping exists?</text><text class="ts" x="330" y="562" text-anchor="middle">resource → data source</text></g>
<line class="arr" x1="460" y1="548" x2="490" y2="548" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="490" y="520" width="150" height="56" rx="4"/><text class="th" x="565" y="543" text-anchor="middle">NO_MAPPING</text><text class="ts" x="565" y="562" text-anchor="middle">you add the mapping</text></g>
<line class="arr" x1="330" y1="576" x2="330" y2="600" marker-end="url(#arrow)"/>
