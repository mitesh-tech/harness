[project]
name = "bookstore"
version = "0.0.1"
description = "Sample FastAPI app that the harness builds features into"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx2>=2.13",  # used by FastAPI's TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.uv]
package = false
