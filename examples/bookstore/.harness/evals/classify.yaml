# yaml-language-server: $schema=../../../../schemas/classify-evals.schema.json
#
# Classification eval cases for the Bookstore.
#
# `expect` says what should happen and, optionally, how:
#   outcome      the outcome, or a list of acceptable outcomes
#   answers      the answer expected at each step
#   path         the steps, in order
#   not_asked    steps that must not happen
#   semif_calls  the most SemIf questions allowed
#   group        (next to task) paraphrases that must take the same path and answers
#
# If the live model disagrees with an expectation, look at why (usually the
# knowledge-base descriptions) rather than quietly changing the expectation.

cases:
  - task: "Add a new book"
    expect:
      outcome: matched
      answers: { area: catalogue, service: add_book }
      path: [area, service]
      not_asked: [kind, entity]

  - task: "Show all books by an author"
    expect:
      outcome: matched
      answers: { area: catalogue, service: list_books }
      path: [area, service]

  - task: "Readers should be able to rate a book from 1 to 5"
    expect:
      outcome: matched
      answers: { area: community, service: add_review }
      path: [area, service]

  - task: "Put Dune into the Summer reads collection"
    expect:
      outcome: matched
      answers: { area: curation, service: add_book_to_collection }
      path: [area, service]

  - task: "Let staff add a new publisher"
    expect:
      outcome: new_service
      answers: { area: catalogue, kind: create, entity: Publisher }
      path: [area, service, kind, entity]
      semif_calls: 4

  - task: "Let staff mark a book as featured on the homepage"
    expect:
      outcome: unsure
      note: "Ambiguous: featured could be a field on Book or a curated list, so a person decides."

  - task: "Let customers save books to a personal wishlist"
    expect:
      outcome: [new_service, no_entity, unsure]

  - task: "Manage shipping addresses for orders"
    expect:
      outcome: [unsure, no_entity]
      not_asked: [kind]
